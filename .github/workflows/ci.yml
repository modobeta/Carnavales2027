name: Pilot checks
on:
  push:
    branches: [main, feat/piloto-produccion]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: carnavales_pilot_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:test-only@localhost:5432/carnavales_pilot_test
      TEST_DATABASE_URL: postgres://postgres:test-only@localhost:5432/carnavales_pilot_test
      BETTER_AUTH_SECRET: isolated-ci-secret-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      FRONTEND_URL: http://localhost:5173
      EMAIL_PROVIDER: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            client/package-lock.json
      - run: npm ci --prefix api
      - run: npm run auth:migrate --prefix api -- --yes
      - run: npm run db:migrate --prefix api
      - run: npm test --prefix api
      - run: npm run audit:verify --prefix api
      - run: npm ci --prefix client
      - run: npm test --prefix client
      - run: npm run build --prefix client
      - run: git diff --exit-code && git diff --check
